<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Solicitação de Projeto</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Solicitação de Projeto</h1>
        </header>
        <main>
            <form action="#" method="GET">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome...">
                <br><br>

                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" name="empresa" required>
                <br><br>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}">
                <br><br>

                <label for="descricao">Descrição do Projeto</label><br>
                <textarea id="descricao" name="descricao" rows="5" cols="50" required placeholder="Descreva seu projeto..."></textarea>
                <br><br>

                <label for="prazo">Prazo de Entrega Desejado</label>
                <input type="date" id="prazo" name="prazo" required>
                <br><br>

                <label for="orcamento">Orçamento Disponível (R$)</label>
                <input type="number" id="orcamento" name="orcamento" min="0" step="0.01" required>
                <br><br>

                <label for="local">Local de Entrega</label>
                <input type="text" id="local" name="local" required>
                <br><br>

                <label for="referencia">Referência do Projeto Anterior</label><br>
                <textarea id="referencia" name="referencia" rows="3" cols="50" placeholder="Informe uma referência, se houver..."></textarea>
                <br><br>

                <label for="contato">Preferência de Contato</label><br>
                <select id="contato" name="contato" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="Email">E-mail</option>
                    <option value="Telefone">Telefone</option>
                    <option value="WhatsApp">WhatsApp</option>
                </select>
                <br><br>

                <input type="checkbox" id="termos" name="termos" value="aceito" required>
                <label for="termos">Aceito os termos e condições.</label>
                <br><br>

                <input type="checkbox" id="novidades" name="novidades" value="sim">
                <label for="novidades">Desejo receber novidades por e-mail.</label>
                <br><br>

                <h2>Dados do Responsável</h2>

                <label for="nomeResponsavel">Nome do Responsável</label>
                <input type="text" id="nomeResponsavel" name="nomeResponsavel" required>
                <br><br>

                <label for="cargoResponsavel">Cargo do Responsável</label>
                <input type="text" id="cargoResponsavel" name="cargoResponsavel" required>
                <br><br>

                <label for="telefoneResponsavel">Telefone do Responsável</label>
                <input type="tel" id="telefoneResponsavel" name="telefoneResponsavel" pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}">
                <br><br>

                <label for="dataInicio">Data de Início do Projeto</label>
                <input type="date" id="dataInicio" name="dataInicio" required>
                <br><br>

                <label for="quantidade">Número de Itens/Produtos</label>
                <input type="number" id="quantidade" name="quantidade" min="1" required>
                <br><br>

                <label for="urgencia">Urgência</label><br>
                <select id="urgencia" name="urgencia" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Media">Média</option>
                    <option value="Alta">Alta</option>
                </select>
                <br><br>

                <label for="setor">Setor da Empresa</label>
                <input type="text" id="setor" name="setor" required>
                <br><br>

                <label for="pagamento">Método de Pagamento Preferido</label><br>
                <select id="pagamento" name="pagamento" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartao">Cartão</option>
                    <option value="Boleto">Boleto</option>
                    <option value="Transferencia">Transferência bancária</option>
                </select>
                <br><br>

                <button type="submit">Enviar Solicitação</button>
            </form>
        </main>
    </body>
</html>
