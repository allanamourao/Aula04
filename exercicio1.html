<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário de Registro de Usuário</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Registro de Usuários</h1>
        </header>
        <main>
             <form action="#" method="GET">

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome...">
                <br><br>

                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" required placeholder="Digite seu sobrenome...">
                <br><br>

                <label for="">Data de Nascimento</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
                <br><br>

                 <label for="">Selecione seu gênero:</label><br>
                 <label for="feminino">Feminino</label>
                 <input type="radio" value="Feminino" id="feminino" name="genero" required>
                 <br>
                 <label for="">Masculino</label>
                 <input type="radio" value="Masculino" id="masculino" name="genero">
                 <br><br>

                 <label for="email">E-mail</label>
                 <input type="email" id="email" name="email" required placeholder="Digite seu email...">
                 <br><br>

                 <label for="telefone">Telefone</label>
                 <input type="tel" id="telefone" name="telefone" required placeholder="Digite seu telefone...">
                 <br><br>
                
                 <label for="endereco">Endereço</label>
                 <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço...">
                 <br><br>

                 <label for="cidade">Cidade</label>
                 <input type="text" id="cidade" name="cidade" required placeholder="Digite sua cidade...">
                 <br><br>

                 <label for="opcao">Selecione seu Estado:</label>
                  <select name="opcao" id="opcao" required>
                     <option value="" selected disabled>Selecione...</option>
                     <option value="São Paulo">São Paulo</option>
                     <option value="Rio de Janeiro">Rio de Janeiro</option>
                     <option value="Minas Gerais">Minas Gerais</option>
                  </select>
                  <br><br>

                 <label for="cep">CEP</label>
                 <input type="text" id="cep" name="cep" required placeholder="Digite seu CEP...">
                 <br><br>

                 <label for="nomeUser">Nome de usuário</label>
                 <input type="text" id="nomeUser" name="nomeUser" required placeholder="Digite seu nome de usuário"> 
                 <br><br>

                 <label for="senha">Senha</label>
                 <input type="password" id="senha" name="senha" required>
                 <br><br>

                 <label for="confirmaSenha">Confirmação de senha</label>
                 <input type="password" id="confirmaSenha" name="confirmaSenha" required>
                 <br><br>

                 <label for="file">Envie uma foto de perfil</label>
                 <input type="file" id="file" name="file">
                 <br><br>
                 
                 <p>Escolha pelo menos um dos Hobbies</p>
                 <input type="checkbox" id="exercicio" name="exercicio" value="exercicio" required>
                 <label for="exercicio">Atividade física(esportes)</label>
                 <br>
                 <input type="checkbox" id="cultura" name="cultura" value="cultura">
                 <label for="cultura">Atividades culturais(literatura e cinema)</label>
                 <br>
                 <input type="checkbox" id="musica" name="musica" value="musica">
                 <label for="receberSms">Atividades musicais(canto e dança)</label>
                 <br><br>

                 <label for="opcoes">Qual seu nível de educação?</label>
                  <select name="opcoes" id="opcoes" required>
                     <option value="" selected disabled>Selecione...</option>
                     <option value="Fundamental incompleto">Fundamental Incompleto</option>
                     <option value="Fundamental completo">Fundamental Completo</option>
                     <option value="Ensino Medio completo">Ensino Médio Completo</option>
                     <option value="Ensino Superior">Ensino Superior</option>
                  </select>
                  <br><br>

                 <label for="profissao">Profissão</label>
                 <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão...">
                 <br><br>
                
                 <label for="biografia">Biografia</label>
                 <textarea name="biografia" id="biografia" rows="5" cols="50" placeholder="O que deseja compartilhar?Digite aqui sua hitória."></textarea>
                 <br><br>
              
                 <input type="checkbox" id="termos" name="termos" value="termos">
                 <label for="termos">Li e concordo com os termos.</label>
                 <br>
                 <input type="checkbox" id="receberNot" name="receberNot" value="receberNot">
                 <label for="receberEmail">Desejo receber notificações.</label>
                 <br><br>

                  <button type="submit">Enviar Registro</button>
             </form>
        </main>
    </body>
</html>
