<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 2 - Formulários</title>
    </head>
    <body>

        <header>
            <h1 style="text-align: center;">Cadastro de alunos😊</h1>
        </header>
        
        <main>
            <!-- Formulário de cadastro -->
             <form action="#" method="GET">

                <!-- Nome do aluno -->
                 <label for="nome">Nome do Aluno</label>
                 <input type="text" id="nome" name="nome" required>
                <br><br>

                <!-- Email do aluno -->
                 <label for="email">Email do Aluno</label>
                 <input type="email" id="email" name="email" required>
                 <br><br>

                 <!-- Campo de telefone -->
                  <label for="telefone">Telefone do Aluno</label>
                  <input type="tel" id="telefone" name="telefone" required>
                  <br><br>

                <!-- Campo de data de nascimento -->
                  <label for="">Data de Nascimento</label>
                  <input type="date" id="dataNascimento" name="dataNascimento" required>
                  <br><br>

                <!-- Idade do aluno -->
                  <label for="idade">Idade do Aluno</label>
                  <input type="number" id="idade" name="idade" required>
                  <br><br>

                <!-- Campo de escolha -->
                 <label for="">Você estuda para as provas?</label><br>
                 <!-- Radio button só pode ser escolhido uma vez -->
                 <label for="sim">Sim, estudo.</label>
                 <input type="radio" value="Sim" id="sim" name="pergunta">
                 <br>
                 <label for="">Não estudo.</label>
                 <input type="radio" value="Nao" id="nao" name="pergunta">
                 <br><br>

                 <!-- Campo range -->
                  <label for="progresso">O quanto você gosta das aulas do SENAI</label>
                  <!-- Input tipo range cria uma barra de progresso(tipo volume) -->
                  <input type="range" id="progresso" name="progresso">
                  <br><br>

                 <!-- Input de Cor 🎨-->
                  <label for="cor">Escolha sua cor favorita</label>
                  <input type="color" id="cor" name="cor">
                  <br><br>

                 <!-- Campo de seleção -->
                  <label for="opcao">Selecione a sua sala:</label>
                  <select name="opcao" id="opcao">
                    <!-- Criando opções para selecionar -->
                     <option value="" selected disabled>Selecione...</option>
                     <option value="Sala Vermelha">Sala Vermelha</option>
                     <option value="Sala Azul">Sala Azul</option>
                     <option value="Sala Verde">Sala Verde</option>
                  </select>
                  <br><br>

                 <!-- Campo de Arquivo🌆-->
                  <label for="file">Envie sua foto</label>
                  <input type="file" id="file" name="file">
                  <br><br>

                 <!-- Campo com textarea -->
                  <label for="observacoes">Observações:</label>
                  <textarea name="observacoes" id="observacoes" rows="5" cols="50"></textarea>
                  <br><br>

                 <!-- Campo com checkbox ☑️-->
                  <input type="checkbox" id="termos" name="termos" value="termos">
                  <label for="termos">Li e concordo com os termos.</label>
                  <br>
                  <input type="checkbox" id="receberEmail" name="receberEmail" value="receberEmail">
                  <label for="receberEmail">Desejo receber o e-mail de divulgação.</label>
                  <br>
                  <input type="checkbox" id="receberSms" name="receberSms" value="receberSms">
                  <label for="receberSms">Desejo receber SMS de divulgação.</label>
                  <br><br>

                 <!-- Botão de envio -->
                  <button type="submit">Enviar</button>
             </form>
        </main>
    </body>
</html>
