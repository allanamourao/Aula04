<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário de Inscrição em Evento</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Inscrição para Evento</h1>
        </header>
        <main>
            <form action="#" method="GET">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome..." pattern="[A-Za-zÀ-ÿ\s]+">
                <br><br>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="Digite seu e-mail...">
                <br><br>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000" pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}">
                <br><br>

                <label for="cargo">Cargo</label>
                <input type="text" id="cargo" name="cargo" required>
                <br><br>

                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" name="empresa" required>
                <br><br>

                <label for="dataEvento">Data do Evento</label>
                <input type="date" id="dataEvento" name="dataEvento" required>
                <br><br>

                <label for="horario">Horário de Chegada</label>
                <input type="time" id="horario" name="horario" required>
                <br><br>

                <label for="alimentacao">Alimentação Preferida</label><br>
                <select id="alimentacao" name="alimentacao" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="Onivora">Onívora</option>
                    <option value="Vegetariana">Vegetariana</option>
                    <option value="Vegana">Vegana</option>
                    <option value="Outra">Outra</option>
                </select>
                <br><br>

                <label for="restricoes">Restrições Alimentares</label><br>
                <textarea id="restricoes" name="restricoes" rows="3" cols="50" placeholder="Informe suas restrições alimentares, caso haja..."></textarea>
                <br><br>

                <label for="necessidades">Necessidades Especiais</label><br>
                <textarea id="necessidades" name="necessidades" rows="3" cols="50" placeholder="Informe suas necessidades especiais, caso haja..."></textarea>
                <br><br>

                <input type="checkbox" id="politica" name="politica" value="aceito" required>
                <label for="politica">Aceito a Política de Privacidade.</label>
                <br><br>

                <input type="checkbox" id="atualizacoes" name="atualizacoes" value="sim">
                <label for="atualizacoes">Desejo receber atualizações sobre o evento.</label>
                <br><br>

                <h2>Dados do Acompanhante</h2>

                <label for="nomeAcompanhante">Nome do Acompanhante</label>
                <input type="text" id="nomeAcompanhante" name="nomeAcompanhante" pattern="[A-Za-zÀ-ÿ\s]+">
                <br><br>

                <label for="emailAcompanhante">E-mail do Acompanhante</label>
                <input type="email" id="emailAcompanhante" name="emailAcompanhante">
                <br><br>

                <label for="telefoneAcompanhante">Telefone do Acompanhante</label>
                <input type="tel" id="telefoneAcompanhante" name="telefoneAcompanhante" placeholder="(00) 00000-0000" pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}">
                <br><br>

                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento" name="dataNascimento">
                <br><br>

                <label for="empresaAcompanhante">Empresa do Acompanhante</label>
                <input type="text" id="empresaAcompanhante" name="empresaAcompanhante">
                <br><br>

                <label for="cargoAcompanhante">Cargo do Acompanhante</label>
                <input type="text" id="cargoAcompanhante" name="cargoAcompanhante">
                <br><br>

                <label for="assento">Preferência de Assento</label><br>
                <select id="assento" name="assento">
                    <option value="" selected disabled>Selecione...</option>
                    <option value="Frente">Próximo ao palco</option>
                    <option value="Centro">Centro</option>
                    <option value="Fundo">Fundo</option>
                    <option value="Corredor">Próximo ao corredor</option>
                    <option value="SemPreferencia">Sem preferência</option>
                </select>
                <br><br>

                <label for="informacoes">Outras Informações Relevantes</label><br>
                <textarea id="informacoes" name="informacoes" rows="5" cols="50" placeholder="Digite outras informações relevantes, se houver..."></textarea>
                <br><br>

                <button type="submit">Enviar Inscrição</button>
            </form>
        </main>
    </body>
</html>
