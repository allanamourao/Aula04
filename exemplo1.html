<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário - Exemplo 1</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Formulário de Cadastro</h1>
        </header>

        <!-- Conteúdo principal -->
         <main>
            <!-- Criação de formulário -->
            <!-- Action com # mantém o formulário na mesma página -->
            <!-- Method GET faz o envio pela URL da página -->
             <form action="#" method="GET">
            <!-- Primeiro campo -->
             <label for="nome">Nome</label>
             <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
             <br><br>
             <!-- Segundo campo -->
              <label for="">Idade</label>
              <input type="number" id="idade" name="idade" placeholder="Digite sua idade..." required>
              <br><br>
              <!-- Botão para envio do form -->
               <button type="submit">Enviar</button>
             </form>
         </main>
    </body>
</html>
