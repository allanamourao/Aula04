<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário de Avaliação de Produto</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Avaliação de Produto</h1>
        </header>
        <main>
             <form action="#" method="GET">

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome...">
                <br><br>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="Digite seu email...">
                <br><br>

                <label for="avaliacao">Avaliação</label>
                <input type="number" id="avaliacao" name="avaliacao" required placeholder="Digite sua nota...">
                <br><br>
            
                <label for="comentario">Comentário</label><br>
                <textarea name="comentario" id="comentario" rows="5" cols="50" required placeholder="O que deseja compartilhar?Digite aqui."></textarea>
                <br><br>

                <label for="">Recomendaria?</label><br>
                <label for="sim">Sim</label>
                <input type="radio" value="Sim" id="sim" name="simounao" required>
                <br>
                <label for="nao">Não</label>
                <input type="radio" value="Nao" id="nao" name="simounao">
                <br><br>

                <label for="opcao">Razão da Avaliação</label>
                  <select name="opcao" id="opcao" required>
                     <option value="" selected disabled>Selecione...</option>
                     <option value="Quebrado">Veio quebrado</option>
                     <option value="Gosto Pessoal">Não faz meu gosto/estilo</option>
                     <option value="Faz Gosto">Faz o meu gosto/estilo e está em bom estado</option>
                  </select>
                  <br><br>

                <label for="sugestao">Sugestão de melhoria</label><br>
                <textarea name="sugestao" id="sugestao" rows="5" cols="50" required placeholder="Digite aqui sua sugestão..."></textarea>
                <br><br>
                
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" required>
                <br><br>

                <label for="">Selecione seu gênero:</label><br>
                <label for="feminino">Feminino</label>
                <input type="radio" value="Feminino" id="feminino" name="genero" required>
                <br>
                <label for="">Masculino</label>
                <input type="radio" value="Masculino" id="masculino" name="genero">
                <br><br>

                <label for="satisfacao">Satisfação com o produto:</label>
                <input type="range" id="satisfacao" name="satisfacao" min="0" max="100" step="1" value="0" required>


                <label for="facilidade">Facilidade de uso:</label>
                <input type="number" id="facilidade" name="facilidade" required>
                <br><br>

                <label for="qualidade">Qualidade do Produto:</label>
                <input type="number" id="qualidade" name="qualidade" required>
                <br><br>

                <label for="preco">Preço:</label>
                <input type="number" id="preco" name="preco" required>
                <br><br>

                <label for="versao">Versão do Produto</label>
                <input type="text" id="versao" name="versao" required>
                <br><br>

                <label for="localizacao">Localização</label>
                <input type="text" id="localizacao" name="localizacao" required>
                <br><br>

                <label for="">Data da compra:</label>
                <input type="date" id="dataCompra" name="dataCompra" required>
                <br><br>

                <label for="opcao">Origem da Compra</label>
                  <select name="opcao" id="opcao" required>
                     <option value="" selected disabled>Selecione...</option>
                     <option value="RJ">Rio de Janeiro</option>
                     <option value="MG">Minas Gerais</option>
                     <option value="SP">São Paulo</option>
                  </select>
                  <br><br>

                <label for="satisfacaosu">Nível de satisfação com o suporte</label>
                <input type="range" id="satisfacaosu" name="satisfacaosu" min="0" max="100" step="1" value="0" required>
                <br><br>

                <button type="submit">Enviar Avaliação</button>
             </form>
        </main>
    </body>
</html>
